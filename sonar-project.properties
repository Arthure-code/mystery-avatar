sonar.projectKey=Arthure-code_mystery-avatar
sonar.organization=arthuredevsecops


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=mystery-avatar
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# The page, the script and the stylesheet are the code; pictures and
# screenshots are not. There are no unit tests, so coverage is not measured.
sonar.sources=index.html,js,css
sonar.exclusions=images/**,*.png
sonar.coverage.exclusions=**/*
